# Profil PRODUCTION ? a activer explicitement sur le serveur de deploiement
# avec : --spring.profiles.active=prod
# ou variable d'environnement : SPRING_PROFILES_ACTIVE=prod

spring.jpa.show-sql=false

# Ne pas executer de requetes JPA pendant le rendu des vues (evite les
# N+1 silencieux et le warning vu au demarrage)
spring.jpa.open-in-view=false

# Logs moins verbeux en production
logging.level.com.pfe.backend=INFO
logging.level.org.springframework.security=WARN

# Ne jamais exposer la pile d'erreur complete au client en production
server.error.include-stacktrace=never
server.error.include-message=never

# ATTENTION : ddl-auto passe a "validate" en prod (voir bloc Flyway ci-dessous).
# Hibernate ne modifie plus jamais le schema tout seul ; il verifie seulement
# qu'il correspond aux entites. Toute evolution de schema doit desormais
# passer par un script Flyway dans src/main/resources/db/migration.
spring.jpa.hibernate.ddl-auto=validate

# ---- Flyway ----
# Active uniquement en prod. baseline-on-migrate=true + baseline-version=1
# permettent de "brancher" Flyway sur une base de donnees DEJA EXISTANTE
# (creee jusqu'ici par Hibernate) sans rien reecrire : au premier demarrage,
# Flyway marque l'etat courant comme V1 (sans executer de SQL dessus), puis
# applique uniquement les migrations suivantes (V2__xxx.sql, V3__xxx.sql...)
# que tu ajouteras dans src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=etat_existant_avant_flyway