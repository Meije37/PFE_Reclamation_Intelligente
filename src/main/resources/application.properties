spring.application.name=backend

# Profil actif par defaut en local. Sur le serveur de production, definir
# la variable d'environnement SPRING_PROFILES_ACTIVE=prod pour remplacer ceci.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Base de donnees ----
# En local, les valeurs par defaut (apres le ":") sont utilisees si aucune
# variable d'environnement n'est definie. En production, definir les vraies
# variables DB_URL / DB_USERNAME / DB_PASSWORD sur le serveur (jamais en dur ici).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pfe_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:3776}
spring.jpa.hibernate.ddl-auto=update

# ---- Flyway ----
# Desactive par defaut en dev : Hibernate (ddl-auto=update) continue de gerer
# le schema pendant le developpement, comme avant. Voir application-prod.properties
# pour l'activation en production, avec baseline sur la base existante.
spring.flyway.enabled=false

server.port=${SERVER_PORT:8081}
server.address=0.0.0.0

# ---- CORS ----
# Origines web autorisees a appeler l'API avec cookies/credentials.
# En prod, definir APP_CORS_ALLOWED_ORIGINS avec le(s) vrai(s) domaine(s),
# separes par une virgule si plusieurs (ex: https://app.mondomaine.mr,https://admin.mondomaine.mr).
# Ne JAMAIS mettre "*" ici : incompatible en securite avec allowCredentials=true.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---- JWT ----
jwt.secret=${JWT_SECRET:maCleSecreteTresLonguePourJwt2026ProjetPFE}
jwt.expiration=${JWT_EXPIRATION:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---- Envoi d'emails (OTP mot de passe oublie) ----
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=4cd3cacb3167ea
spring.mail.password=46acc2a0764c4a
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@pfe-reclamations.mr}

# ---- Fichiers uploades ----
# Stocke dans un sous-dossier du dossier utilisateur (~/pfe-reclamations/uploads
# sur Mac/Linux, C:/Users/TonNom/pfe-reclamations/uploads sur Windows).
# Ce chemin est garanti identique en concept sur TOUTE machine, quel que soit
# le dossier depuis lequel la commande est lancee (contrairement a un chemin
# relatif comme "./uploads" qui depend du repertoire de travail courant).
# UPLOAD_PATH reste disponible pour forcer un autre emplacement si besoin.
upload.path=${UPLOAD_PATH:${user.home}/pfe-reclamations/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB